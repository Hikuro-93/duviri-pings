name: Planet doctor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PLANET_FISSURES_CHANNEL_ID: ${{ secrets.PLANET_FISSURES_CHANNEL_ID }}
          PLANET_FISSURES_WEBHOOK_URL: ${{ secrets.PLANET_FISSURES_WEBHOOK_URL }}
        run: node doctor.mjs
