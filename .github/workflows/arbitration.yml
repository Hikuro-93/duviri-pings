name: Arbitration

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: arbitration
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ARBITRATION_CHANNEL_ID: ${{ secrets.ARBITRATION_CHANNEL_ID }}
          ARBITRATION_WEBHOOK_URL: ${{ secrets.ARBITRATION_WEBHOOK_URL }}
        run: node arbitration.mjs
