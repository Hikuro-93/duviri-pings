name: Arbitration

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: arbitration
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: .arbitration-state
          key: arbitration-state-${{ github.run_id }}
          restore-keys: arbitration-state

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - env:
          ARBITRATION_WEBHOOK_URL: ${{ secrets.ARBITRATION_WEBHOOK_URL }}
        run: node arbitration.mjs

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .arbitration-state
          key: arbitration-state-${{ github.run_id }}
