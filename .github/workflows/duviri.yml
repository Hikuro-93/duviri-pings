name: Duviri

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: duviri
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: .duviri-state
          key: duviri-state-${{ github.run_id }}
          restore-keys: duviri-state

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: node duviri.mjs

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .duviri-state
          key: duviri-state-${{ github.run_id }}
