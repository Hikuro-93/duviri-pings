name: Cetus

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: cetus
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: .cetus-state
          key: cetus-state-${{ github.run_id }}
          restore-keys: cetus-state

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - env:
          CETUS_WEBHOOK_URL: ${{ secrets.CETUS_WEBHOOK_URL }}
        run: node cetus.mjs

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cetus-state
          key: cetus-state-${{ github.run_id }}
