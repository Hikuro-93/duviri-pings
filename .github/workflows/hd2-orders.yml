name: Helldivers orders

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          HD2_ORDERS_CHANNEL_ID: ${{ secrets.HD2_ORDERS_CHANNEL_ID }}
          HD2_ORDERS_WEBHOOK_URL: ${{ secrets.HD2_ORDERS_WEBHOOK_URL }}
        run: node hd2-orders.mjs
